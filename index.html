<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habitudes</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habitudes">
<meta name="theme-color" content="#0e1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg:#f3f2ef; --bg2:#e9e7e2; --card:rgba(255,255,255,.82); --card-solid:#fff; --ink:#15171b; --ink2:#454a53; --mute:#7c818a;
    --line:rgba(20,22,27,.09); --cell:#e6e4de; --box:#d9d6cf; --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    --c0:#138a5e; --c1:#5b4bc4; --c2:#d9591f; --c3:#2a78d6; --c4:#c43f72; --c5:#b07400;
    --glow1:rgba(19,138,94,.16); --glow2:rgba(91,75,196,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:#0e1116; --bg2:#131820; --card:rgba(24,29,37,.78); --card-solid:#181d25; --ink:#f1f3f6; --ink2:#bcc3cd; --mute:#838c98;
      --line:rgba(255,255,255,.08); --cell:#222933; --box:#343c48; --shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 12px 32px rgba(0,0,0,.35);
      --c0:#1faf7a; --c1:#9085e9; --c2:#e0692f; --c3:#3987e5; --c4:#d55181; --c5:#c98500;
      --glow1:rgba(31,175,122,.18); --glow2:rgba(144,133,233,.14);
    }
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; color:var(--ink); font:15px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(900px 500px at 10% -10%, var(--glow1), transparent 60%),
      radial-gradient(800px 480px at 95% 0%, var(--glow2), transparent 60%),
      var(--bg);
    background-attachment:fixed; min-height:100vh;
  }
  main { max-width:1120px; margin:0 auto; padding:28px 16px 80px; }
  .num { font-family:"Space Grotesk", Inter, sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  button, input { font:inherit; color:inherit; }

  /* En-tête */
  .top { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .date { color:var(--mute); font-size:13px; letter-spacing:.02em; }
  .date::first-letter { text-transform:uppercase; }
  h1 { font-family:"Space Grotesk", Inter, sans-serif; font-size:40px; line-height:1.05; margin:4px 0 6px; letter-spacing:-.03em; }
  .tag { color:var(--ink2); font-size:14px; }
  .meta { display:flex; gap:14px; align-items:center; font-size:13px; color:var(--mute); }
  .live::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--mute); margin-right:6px; vertical-align:1px; }
  .live.ok::before { background:var(--c0); box-shadow:0 0 0 0 var(--c0); animation:pulse 2s infinite; }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 color-mix(in srgb, var(--c0) 60%, transparent); } 70% { box-shadow:0 0 0 7px transparent; } 100% { box-shadow:0 0 0 0 transparent; } }
  .link { background:none; border:0; color:var(--mute); cursor:pointer; text-decoration:underline; text-underline-offset:3px; padding:0; }

  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:20px; box-shadow:var(--shadow); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }

  .view-nav { display:flex; gap:6px; padding:5px; border:1px solid var(--line); border-radius:16px; width:fit-content; background:var(--card); margin:0 0 18px; }
  .view-nav button { border:0; border-radius:11px; padding:11px 18px; background:transparent; cursor:pointer; color:var(--ink2); font-weight:600; }
  .view-nav button[aria-pressed="true"] { background:var(--ink); color:var(--bg); }
  .view-nav button:focus-visible { outline:2px solid var(--c0); outline-offset:3px; }
  .personal-intro { margin-bottom:18px; display:flex; align-items:center; gap:18px; }
  .personal-intro h2 { margin:0 0 5px; font-family:"Space Grotesk",sans-serif; font-size:26px; }
  .personal-intro p { margin:0; color:var(--ink2); }
  .people.personal { grid-template-columns:minmax(0,1fr); }
  .personal-layout { max-width:820px; margin:0 auto; }
  .deadline { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:18px; padding:18px 22px; border:1px solid color-mix(in srgb,var(--c0) 30%,var(--line)); border-radius:20px; background:color-mix(in srgb,var(--c0) 8%,var(--card-solid)); }
  .deadline strong { display:block; font-size:16px; margin-bottom:4px; }
  .deadline p { margin:0; color:var(--ink2); font-size:13px; }
  .deadline-clock { text-align:right; flex:none; }
  .deadline-clock b { display:block; font-size:32px; line-height:1.15; font-variant-numeric:tabular-nums; }
  .deadline-clock small { color:var(--ink2); font-size:11px; }
  .deadline.urgent { border-color:var(--c2); background:color-mix(in srgb,var(--c2) 10%,var(--card-solid)); }
  .deadline.urgent .deadline-clock b { color:var(--c2); }
  .deadline.complete strong { color:var(--c0); }
  @media(max-width:520px) { .deadline { padding:16px; gap:12px; align-items:flex-start; flex-direction:column; } .deadline-clock { text-align:left; } .deadline-clock b { font-size:30px; } }
  @media(max-width:520px) { .personal-intro { align-items:flex-start; } .personal-intro h2 { font-size:22px; } }

  .notif { border:1px solid var(--line); background:var(--card); border-radius:999px; padding:6px 12px; cursor:pointer; font-size:13px; color:var(--ink2); white-space:nowrap; }
  .notif.on { color:color-mix(in srgb, var(--c0) 75%, var(--ink)); border-color:color-mix(in srgb, var(--c0) 40%, var(--line)); }
  .notif.off { background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600; }
  .meta { flex-wrap:wrap; justify-content:flex-end; }

  .habit-action { flex:none; border:0; border-radius:7px; background:var(--cell); padding:3px 6px; cursor:pointer; color:var(--ink2); }
  .habit-action:focus-visible { outline:2px solid var(--c0); outline-offset:2px; }
  .frog { border:1px solid color-mix(in srgb,var(--c0) 30%,var(--line)); border-radius:16px; padding:16px; margin-bottom:18px; background:color-mix(in srgb,var(--c0) 6%,var(--card-solid)); }
  .frog-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .frog h3 { margin:0; font-size:18px; }
  .frog p { color:var(--ink2); font-size:13px; margin:8px 0; }
  .frog-name { font-weight:600; overflow-wrap:anywhere; }
  .frog .btn { background:var(--c0); white-space:normal; }
  .frog-score { font-size:12px; color:var(--ink2); margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
  .frog-score b { color:var(--ink); font-size:22px; margin-right:5px; }
  .frog.eaten { border-color:var(--c0); }
  .frog-status { color:var(--c0); font-size:12px; font-weight:600; }
  dialog.editor { width:min(460px,calc(100% - 32px)); padding:24px; border:1px solid var(--line); border-radius:22px; background:var(--card-solid); color:var(--ink); box-shadow:var(--shadow); }
  dialog::backdrop { background:rgba(0,0,0,.5); backdrop-filter:blur(3px); }
  .editor h2 { margin:0 0 10px; font-family:"Space Grotesk",sans-serif; }
  .editor p { color:var(--ink2); font-size:13px; }
  .editor label { display:block; font-weight:600; font-size:13px; margin:18px 0 8px; }
  .editor input,.editor select { font:inherit; width:100%; padding:12px; border:1px solid var(--box); border-radius:10px; background:var(--bg); color:var(--ink); }
  .editor-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .editor .cancel { background:var(--cell); color:var(--ink); }
  .editor .btn { white-space:normal; }
  .editor-error { color:var(--c2); min-height:20px; margin-top:10px; font-size:13px; }
  button:disabled { cursor:default; opacity:.6; }
  .setup { margin-bottom:18px; border-color:color-mix(in srgb, var(--c3) 40%, var(--line)); background:color-mix(in srgb, var(--c3) 8%, var(--card)); }
  .setup h3 { margin:0 0 4px; }
  .setup p { margin:0 0 12px; color:var(--ink2); font-size:14px; }
  .setup ol { margin:0 0 14px; padding:0; list-style:none; counter-reset:s; display:flex; flex-direction:column; gap:10px; }
  .setup li { counter-increment:s; display:flex; gap:12px; align-items:flex-start; font-size:15px; }
  .setup li::before { content:counter(s); flex:none; width:26px; height:26px; border-radius:50%; background:var(--c3); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .setup .ico { display:inline-flex; vertical-align:-5px; padding:2px 6px; border-radius:7px; background:var(--cell); margin:0 2px; }
  .setup .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .setup .go { --pc:var(--c3); font-size:16px; padding:12px 20px; }

  /* Bandeau du groupe */
  .group { display:grid; grid-template-columns:auto 1fr; gap:22px; align-items:center; margin-bottom:18px; }
  .group .big { display:flex; align-items:center; gap:16px; }
  .group .k { font-size:12px; color:var(--mute); text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
  .group .v { font-size:34px; font-weight:700; line-height:1; margin-top:4px; }
  .group .v small { font-size:16px; color:var(--mute); font-weight:500; }
  .pod { display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; }
  .pod .p { display:flex; align-items:center; gap:10px; padding:8px 14px 8px 8px; border-radius:999px; background:color-mix(in srgb, var(--pc) 12%, transparent); border:1px solid color-mix(in srgb, var(--pc) 30%, transparent); }
  .pod .p b { font-weight:600; }
  .pod .p span { color:var(--ink2); font-size:13px; }
  @media (max-width:700px) { .group { grid-template-columns:1fr; } .pod { justify-content:flex-start; } }

  .av { width:40px; height:40px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex:none;
        background:linear-gradient(135deg, color-mix(in srgb, var(--pc) 85%, white), var(--pc)); color:#fff; font-weight:700; font-family:"Space Grotesk", sans-serif; font-size:17px;
        box-shadow:0 4px 14px color-mix(in srgb, var(--pc) 40%, transparent); }
  .av.s { width:28px; height:28px; font-size:13px; box-shadow:none; }

  /* Anneau */
  .ring { position:relative; flex:none; }
  .ring svg { display:block; transform:rotate(-90deg); }
  .ring .bg { stroke:var(--cell); }
  .ring .fg { stroke:var(--pc, var(--c0)); stroke-linecap:round; transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1); filter:drop-shadow(0 0 6px color-mix(in srgb, var(--pc, var(--c0)) 45%, transparent)); }
  .ring .in { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; line-height:1; }
  .ring .in b { font-size:17px; font-weight:700; }
  .ring .in span { font-size:10px; color:var(--mute); margin-top:3px; }

  /* Cartes personnes */
  .people { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap:18px; margin-bottom:18px; align-items:start; }
  .person { position:relative; overflow:hidden; }
  .person::before { content:""; position:absolute; inset:0 0 auto 0; height:3px; background:linear-gradient(90deg, var(--pc), color-mix(in srgb, var(--pc) 20%, transparent)); }
  .person.me { border-color:color-mix(in srgb, var(--pc) 35%, var(--line)); }
  .ph { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .ph .who { flex:1; min-width:0; }
  .ph h2 { font-family:"Space Grotesk", Inter, sans-serif; font-size:21px; margin:0; letter-spacing:-.02em; display:flex; align-items:baseline; gap:8px; }
  .ph h2 small { font-family:Inter, sans-serif; font-size:12px; color:var(--mute); font-weight:500; }
  .ph .sub { font-size:13px; color:var(--ink2); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .kpis { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:18px; }
  .kpi { background:color-mix(in srgb, var(--pc) 7%, transparent); border:1px solid color-mix(in srgb, var(--pc) 16%, transparent); border-radius:14px; padding:10px 10px 9px; min-width:0; }
  .kpi .k { font-size:11px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .kpi .v { font-size:24px; font-weight:700; line-height:1.1; margin-top:3px; white-space:nowrap; }
  .kpi .v small { font-size:13px; font-weight:500; color:var(--mute); }
  .kpi .t { font-size:11px; margin-top:1px; color:var(--mute); white-space:nowrap; }
  .kpi .t.up { color:var(--c0); } .kpi .t.down { color:var(--c2); }
  @media (max-width:420px) { .kpis { grid-template-columns:repeat(2, 1fr); } }

  .sect { font-size:11px; color:var(--mute); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin:0 0 8px; display:flex; justify-content:space-between; }
  .habits { --bx:30px; margin-bottom:18px; }
  .hrow { display:grid; grid-template-columns:minmax(0,1fr) repeat(7, var(--bx)); gap:5px; align-items:center; padding:5px 0; }
  .hrow + .hrow { border-top:1px solid var(--line); }
  .hrow.head { padding:0 0 4px; }
  .hrow.head span { font-size:11px; color:var(--mute); text-align:center; line-height:1.15; }
  .hrow.head span.today { color:var(--ink); font-weight:700; }
  .hname { min-width:0; display:flex; align-items:center; gap:6px; }
  .hname .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .chip { font-size:11px; padding:1px 7px; border-radius:999px; white-space:nowrap; background:color-mix(in srgb, var(--pc) 14%, transparent); color:color-mix(in srgb, var(--pc) 70%, var(--ink)); font-weight:600; }
  .chip.hot { background:linear-gradient(90deg, #ff9a3c, #ff5e62); color:#fff; }
  .del { background:none; border:0; color:var(--mute); cursor:pointer; font-size:12px; padding:2px 4px; opacity:0; transition:opacity .15s; }
  .hrow:hover .del, .del:focus { opacity:1; }
  @media (hover:none) { .del { opacity:.6; } }
  .box { width:var(--bx); height:var(--bx); border-radius:9px; border:1.5px solid var(--box); background:transparent; display:inline-flex; align-items:center; justify-content:center; color:#fff; padding:0; transition:transform .12s, background .15s, border-color .15s; }
  .box svg { width:15px; height:15px; opacity:0; transform:scale(.4); transition:all .18s; }
  .box.on { background:var(--pc); border-color:var(--pc); box-shadow:0 2px 10px color-mix(in srgb, var(--pc) 40%, transparent); }
  .box.on svg { opacity:1; transform:scale(1); }
  .box:not([disabled]) { cursor:pointer; }
  .box:not([disabled]):hover { border-color:var(--pc); transform:translateY(-1px); }
  .box:not([disabled]):active { transform:scale(.9); }
  .box.pop { animation:pop .35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform:scale(.7); } 100% { transform:scale(1); } }
  .box.today:not(.on) { border-style:dashed; }
  .box.locked { opacity:.55; }
  .box.locked:not(.on) { background:repeating-linear-gradient(135deg, transparent 0 4px, color-mix(in srgb, var(--box) 45%, transparent) 4px 5px); }
  @media (max-width:520px) {
    .habits { --bx:clamp(26px, 9vw, 32px); }
    .hrow:not(.head) { grid-template-columns:repeat(7, var(--bx)); justify-content:space-between; row-gap:6px; }
    .hrow:not(.head) .hname { grid-column:1 / -1; }
    .hrow.head { grid-template-columns:repeat(7, var(--bx)); justify-content:space-between; }
    .hrow.head > :first-child { display:none; }
  }
  .add { display:flex; gap:8px; margin-top:10px; }
  .add input { flex:1; min-width:0; padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:color-mix(in srgb, var(--card-solid) 70%, transparent); }
  .add input:focus { outline:2px solid color-mix(in srgb, var(--pc) 50%, transparent); outline-offset:1px; }
  .btn { padding:10px 16px; border-radius:12px; border:0; background:var(--pc, var(--ink)); color:#fff; cursor:pointer; font-weight:600; white-space:nowrap; }
  .empty { color:var(--mute); font-size:13px; padding:8px 0; }

  /* Calendrier */
  .heat-wrap { overflow-x:auto; scrollbar-width:none; margin-bottom:6px; }
  .heat-wrap::-webkit-scrollbar { display:none; }
  .heat { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7, 11px); gap:3px; width:max-content; }
  .heat i { width:11px; height:11px; border-radius:3px; background:var(--cell); display:block; }
  .heat i.l1 { background:color-mix(in srgb, var(--pc) 30%, var(--cell)); }
  .heat i.l2 { background:color-mix(in srgb, var(--pc) 55%, var(--cell)); }
  .heat i.l3 { background:color-mix(in srgb, var(--pc) 78%, var(--cell)); }
  .heat i.l4 { background:var(--pc); box-shadow:0 0 6px color-mix(in srgb, var(--pc) 45%, transparent); }
  .heat i.fut { background:transparent; }
  .heat i.t { outline:1.5px solid var(--ink); outline-offset:1px; }
  .heat-months { display:grid; grid-auto-flow:column; grid-auto-columns:11px; gap:3px; font-size:10px; color:var(--mute); height:15px; width:max-content; }
  .heat-months span { white-space:nowrap; }
  .heat-foot { display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--mute); margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .legend { display:flex; align-items:center; gap:3px; }
  .legend i { width:10px; height:10px; border-radius:2px; display:inline-block; }

  .badges { display:flex; flex-wrap:wrap; gap:6px; }
  .bdg { width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; background:color-mix(in srgb, var(--pc) 12%, transparent); border:1px solid color-mix(in srgb, var(--pc) 25%, transparent); cursor:default; }
  .bdg.off { filter:grayscale(1); opacity:.28; background:transparent; border-style:dashed; border-color:var(--line); }

  /* Bas de page */
  .duo { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-bottom:18px; }
  @media (max-width:820px) { .duo { grid-template-columns:1fr; } }
  h3 { font-family:"Space Grotesk", Inter, sans-serif; font-size:17px; margin:0 0 14px; letter-spacing:-.01em; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  h3 small { font-family:Inter, sans-serif; font-size:12px; color:var(--mute); font-weight:500; }

  .lb { display:flex; flex-direction:column; gap:12px; }
  .lb .r { display:grid; grid-template-columns:26px 28px minmax(60px, 110px) 1fr 48px; gap:10px; align-items:center; }
  .lb .medal { font-size:18px; text-align:center; }
  .lb .rank { color:var(--mute); text-align:center; font-weight:600; }
  .lb .nm { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .lb .track { height:12px; border-radius:6px; background:var(--cell); overflow:hidden; }
  .lb .track i { display:block; height:100%; border-radius:6px; background:linear-gradient(90deg, color-mix(in srgb, var(--pc) 60%, transparent), var(--pc)); transition:width .6s cubic-bezier(.2,.8,.2,1); }
  .lb .pct { text-align:right; font-weight:700; }

  .dow { display:grid; grid-template-columns:repeat(7, 1fr); gap:8px; height:150px; align-items:end; }
  .dow .c { display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .dow .bars { display:flex; gap:2px; align-items:flex-end; height:120px; width:100%; justify-content:center; }
  .dow .bars i { flex:1; max-width:14px; border-radius:4px 4px 0 0; background:var(--pc); min-height:2px; display:block; }
  .dow .lab { font-size:11px; color:var(--mute); }
  .keys { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink2); margin-top:12px; }
  .keys span::before { content:""; display:inline-block; width:10px; height:10px; border-radius:3px; background:var(--pc); margin-right:6px; vertical-align:-1px; }
  .insight { font-size:13px; color:var(--ink2); margin-top:10px; line-height:1.5; }

  .feed { list-style:none; margin:0; padding:0; }
  .feed li { display:flex; gap:12px; align-items:center; padding:9px 0; }
  .feed li + li { border-top:1px solid var(--line); }
  .feed .txt { flex:1; min-width:0; font-size:14px; }
  .feed .txt b { font-weight:600; }
  .feed .when { color:var(--mute); font-size:12px; white-space:nowrap; }
  .feed .late { color:var(--mute); font-size:12px; }

  /* Connexion */
  .auth { max-width:380px; margin:12vh auto 0; }
  .auth h1 { margin-bottom:4px; }
  .auth .f { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .auth input { padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:color-mix(in srgb, var(--card-solid) 70%, transparent); }
  .auth .btn { --pc:var(--c0); width:100%; padding:12px; }
  .err { color:#e5484d; min-height:1.2em; font-size:13px; }

  #tip { position:fixed; pointer-events:none; background:var(--ink); color:var(--bg); font-size:12px; padding:6px 9px; border-radius:8px; white-space:nowrap; z-index:20; display:none; box-shadow:0 6px 20px rgba(0,0,0,.25); }
  .confetti { position:fixed; top:-10px; width:8px; height:12px; border-radius:2px; z-index:30; pointer-events:none; animation:fall linear forwards; }
  @keyframes fall { to { transform:translate(var(--dx), 105vh) rotate(var(--rot)); opacity:.9; } }
  .toast { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:14px; font-weight:600; z-index:31; box-shadow:0 10px 30px rgba(0,0,0,.3); animation:toast 2.6s ease forwards; }
  @keyframes toast { 0% { opacity:0; transform:translate(-50%, 10px); } 10%, 85% { opacity:1; transform:translate(-50%, 0); } 100% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<div id="tip"></div>
<dialog id="edit-dialog" class="editor" aria-labelledby="editor-title"></dialog>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById('app');
let me = null, data = { profiles: [], habits: [], checks: [], frogs: [], frogStats: [], frogReady: false }, channel = null, live = false;

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const lastDays = n => Array.from({ length: n }, (_, i) => addDays(new Date(), i - n + 1));
const JOURS = ['dim','lun','mar','mer','jeu','ven','sam'];
const JOURS_LONG = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const pct = x => Math.round(x * 100) + ' %';
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  const j = Math.floor(s / 86400); return j === 1 ? 'hier' : `il y a ${j} j`;
}

// ---------- Connexion ----------
function renderAuth(mode = 'in', msg = '') {
  app.innerHTML = `
    <div class="auth card">
      <div class="date">${new Date().toLocaleDateString('fr-CA', { weekday:'long', day:'numeric', month:'long' })}</div>
      <h1>Habitudes</h1>
      <div class="tag">On se tient accountable.</div>
      <div class="f">
        ${mode === 'up' ? '<input id="name" type="text" placeholder="Ton prénom" autocomplete="given-name">' : ''}
        <input id="email" type="email" placeholder="Courriel" autocomplete="email">
        <input id="pw" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="${mode==='up'?'new-password':'current-password'}">
        <button class="btn" id="go">${mode === 'up' ? 'Créer mon compte' : 'Se connecter'}</button>
        <div class="err" id="err">${esc(msg)}</div>
        <button class="link" id="switch">${mode === 'up' ? "J'ai déjà un compte" : 'Première fois? Créer un compte'}</button>
      </div>
    </div>`;
  document.getElementById('switch').onclick = () => renderAuth(mode === 'up' ? 'in' : 'up');
  const go = async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('pw').value;
    const err = document.getElementById('err');
    err.textContent = '';
    if (mode === 'up') {
      const name = document.getElementById('name').value.trim();
      if (!name) { err.textContent = 'Écris ton prénom.'; return; }
      const { error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
      if (error) err.textContent = error.message;
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) err.textContent = error.message === 'Invalid login credentials' ? 'Courriel ou mot de passe invalide.' : error.message;
    }
  };
  document.getElementById('go').onclick = go;
  app.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
}

// ---------- Données ----------
let saving = 0, loadSequence = 0;
async function load() {
  if (saving) { reload(250); return; }
  const sequence = ++loadSequence, uid = me?.id;
  if (!uid) return;
  const today = ymd(new Date());
  const [p, h, c, f, fs] = await Promise.all([
    sb.from('profiles').select('*'),
    sb.from('habits').select('*').order('created_at'),
    sb.from('checks').select('*').gte('day', ymd(addDays(new Date(), -400))),
    sb.from('frog_days').select('*').eq('day', today),
    sb.rpc('frog_stats', { p_day: today }),
  ]);
  if (sequence !== loadSequence || saving || me?.id !== uid) return;
  if (p.error || h.error || c.error) { toast('Chargement impossible. Réessaie dans un instant.'); return; }
  data = { profiles: p.data || [], habits: h.data || [], checks: c.data || [],
    frogs: f.data || [], frogStats: fs.data || [], frogReady: !f.error && !fs.error };
  render();
}
async function saveChange(action) {
  saving++; loadSequence++;
  try { return await action(); }
  finally { saving--; reload(0); }
}

let pendingReload = null;
const reload = (ms = 150) => { clearTimeout(pendingReload); pendingReload = setTimeout(load, ms); };
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('tout')
    .on('postgres_changes', { event: '*', schema: 'public' }, () => reload(250))
    .subscribe(status => { live = status === 'SUBSCRIBED'; const el = document.querySelector('.live'); if (el) el.classList.toggle('ok', live); });
}

// ---------- Calculs ----------
function model() {
  const set = new Set(data.checks.map(c => c.habit_id + c.day));
  const byHabit = new Map();
  for (const c of data.checks) { if (!byHabit.has(c.habit_id)) byHabit.set(c.habit_id, []); byHabit.get(c.habit_id).push(c.day); }
  const startOf = h => ymd(new Date(h.created_at));
  const endOf = h => h.archived_at ? ymd(new Date(h.archived_at)) : null;
  const active = (h, k) => (k >= startOf(h) && (!endOf(h) || k < endOf(h))) || set.has(h.id + k);
  // all = true inclut les habitudes archivées (pour l'historique); sinon seulement celles en cours
  const habitsOf = (uid, all) => data.habits.filter(h => h.user_id === uid && (all || !h.archived_at));
  function day(uid, k) {
    let done = 0, total = 0;
    for (const h of habitsOf(uid, true)) if (active(h, k)) { total++; if (set.has(h.id + k)) done++; }
    return { done, total };
  }
  function streak(h) {
    let n = 0, d = new Date();
    if (!set.has(h.id + ymd(d))) d = addDays(d, -1);
    while (set.has(h.id + ymd(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  function best(h) {
    const days = [...(byHabit.get(h.id) || [])].sort();
    let b = 0, run = 0, prev = null;
    for (const k of days) { run = prev && ymd(addDays(new Date(prev + 'T12:00'), 1)) === k ? run + 1 : 1; b = Math.max(b, run); prev = k; }
    return b;
  }
  function rateRange(uid, from, to, only) { // jours de from à to en arrière (0 = aujourd'hui)
    let done = 0, total = 0;
    for (let i = from; i < to; i++) {
      const k = ymd(addDays(new Date(), -i));
      for (const h of only ? [only] : habitsOf(uid, true)) if (active(h, k)) { total++; if (set.has(h.id + k)) done++; }
    }
    return total ? done / total : null;
  }
  const perfect = (uid, k) => { const s = day(uid, k); return s.total > 0 && s.done === s.total; };
  function perfectStreak(uid) {
    let n = 0, d = new Date();
    if (!perfect(uid, ymd(d))) d = addDays(d, -1);
    while (perfect(uid, ymd(d))) { n++; d = addDays(d, -1); }
    return n;
  }
  function bestPerfectRun(uid) {
    let b = 0, run = 0;
    for (const d of lastDays(400)) { run = perfect(uid, ymd(d)) ? run + 1 : 0; b = Math.max(b, run); }
    return b;
  }
  function weekday(uid) {
    const w = Array.from({ length: 7 }, () => ({ done: 0, total: 0 }));
    for (const d of lastDays(84)) { const s = day(uid, ymd(d)); w[d.getDay()].done += s.done; w[d.getDay()].total += s.total; }
    return w.map(x => x.total ? x.done / x.total : null);
  }
  return { set, habitsOf, day, streak, best, rateRange, perfect, perfectStreak, bestPerfectRun, weekday };
}

function badgesFor(uid, M) {
  const habits = M.habitsOf(uid, true);
  const mine = data.checks.filter(c => c.user_id === uid);
  const bestAny = Math.max(0, ...habits.map(M.best));
  const hour = c => c.created_at && c.day === ymd(new Date(c.created_at)) ? new Date(c.created_at).getHours() : null;
  return [
    { e:'🌱', t:'Premier pas', d:'1er coché', ok: mine.length >= 1 },
    { e:'🔥', t:'En feu', d:'3 jours de suite', ok: bestAny >= 3 },
    { e:'⚡', t:'Une semaine', d:'7 jours de suite', ok: bestAny >= 7 },
    { e:'🏔️', t:'Un mois', d:'30 jours de suite', ok: bestAny >= 30 },
    { e:'✨', t:'Journée parfaite', d:'tout coché en une journée', ok: lastDays(400).some(d => M.perfect(uid, ymd(d))) },
    { e:'🏆', t:'Semaine parfaite', d:'7 journées parfaites de suite', ok: M.bestPerfectRun(uid) >= 7 },
    { e:'💯', t:'Centurion', d:'100 cochés', ok: mine.length >= 100 },
    { e:'🌅', t:'Lève-tôt', d:'coché avant 7 h', ok: mine.some(c => { const h = hour(c); return h !== null && h < 7; }) },
    { e:'🦉', t:'Oiseau de nuit', d:'coché après 23 h', ok: mine.some(c => { const h = hour(c); return h !== null && h >= 23; }) },
    { e:'🧱', t:'Bâtisseur', d:'5 habitudes', ok: habits.length >= 5 },
  ];
}

// La couleur suit la personne (ordre stable par id), jamais son rang.
const colorOf = uid => { const ids = data.profiles.map(p => p.id).sort(); return `var(--c${Math.max(0, ids.indexOf(uid)) % 6})`; };
const initial = name => esc((name || '?').trim().charAt(0).toUpperCase());
const people = () => [...data.profiles].sort((a, b) => (b.id === me.id) - (a.id === me.id) || a.name.localeCompare(b.name));

function ring(done, total, size = 64, stroke = 7) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, f = total ? done / total : 0;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}"><circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}"/>
    <circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - f)}"/></svg>
    <div class="in"><b class="num">${total ? `${done}/${total}` : '—'}</b><span>auj.</span></div></div>`;
}

// Préférence locale par compte : aucun changement d'affichage imposé aux autres.
let preferredView = 'group';
function readView(uid) {
  try { return localStorage.getItem(`habitudes:view:${uid}`) === 'personal' ? 'personal' : 'group'; }
  catch { return 'group'; }
}
function setView(view) {
  preferredView = view === 'personal' ? 'personal' : 'group';
  try { localStorage.setItem(`habitudes:view:${me.id}`, preferredView); } catch {}
  render();
  app.querySelector(`[data-view="${preferredView}"]`)?.focus();
}

// Minuit local : les jours de changement d'heure peuvent durer 23 ou 25 heures.
function midnightCountdown(now = new Date()) {
  const midnight = new Date(now);
  midnight.setHours(24, 0, 0, 0);
  const seconds = Math.max(0, Math.ceil((midnight - now) / 1000));
  return { seconds, text: [Math.floor(seconds / 3600), Math.floor(seconds / 60) % 60, seconds % 60].map(n => String(n).padStart(2, '0')).join(':') };
}
function deadlineBanner(done, total, now = new Date()) {
  const timer = midnightCountdown(now);
  const remaining = Math.max(0, total - done), complete = total > 0 && remaining === 0;
  const title = complete ? 'Bravo, tes habitudes du jour sont faites !' : total ? 'Encore un peu de temps pour toi' : 'Une nouvelle habitude commence aujourd’hui';
  const message = complete ? 'Nouvelle journée à minuit.' : total ? `${remaining} habitude${remaining > 1 ? 's' : ''} à compléter avant minuit.` : 'Ajoute ta première habitude pour commencer.';
  return `<section id="deadline" class="deadline ${complete ? 'complete' : ''} ${remaining > 0 && timer.seconds <= 7200 ? 'urgent' : ''}" data-remaining="${remaining}" aria-label="Temps restant aujourd’hui">
    <div><strong>${title}</strong><p>${message}</p></div>
    <div class="deadline-clock"><b id="midnight-timer" class="num" role="timer" aria-live="off" aria-label="Temps restant jusqu’à minuit">${timer.text}</b><small>avant minuit · heure locale</small></div>
  </section>`;
}
let renderedDay = null;
function tickMidnight() {
  if (!me || document.hidden) return;
  const now = new Date();
  if (renderedDay !== ymd(now)) { render(); reload(0); return; }
  const timer = midnightCountdown(now), element = document.getElementById('midnight-timer');
  if (element) element.textContent = timer.text;
  const banner = document.getElementById('deadline');
  if (banner) banner.classList.toggle('urgent', Number(banner.dataset.remaining) > 0 && timer.seconds <= 7200);
}

// ---------- Notifications ----------
// État: on | off | denied | ios (iPhone hors écran d'accueil) | unsupported
let notif = 'unsupported';
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushOK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const swReady = pushOK ? navigator.serviceWorker.register('sw.js').catch(() => null) : Promise.resolve(null);

function notifButton() {
  const b = {
    on: ['on', '🔔 Notifs activées', 'Clique pour recevoir une notification d’essai'],
    off: ['off', '🔔 Activer les notifs', 'Rappel à 21 h et journées parfaites des autres'],
    denied: ['', '🔕 Notifs bloquées', 'Réactive-les dans les réglages du navigateur pour ce site'],
    ios: ['', '📲 Notifs: installe l’appli', 'Sur iPhone: Partager → Sur l’écran d’accueil, puis ouvre l’appli de là'],
  }[notif];
  return b ? `<button class="notif ${b[0]}" id="notif" data-tip="${b[2]}">${b[1]}</button>` : '';
}
const b64ToBytes = s => { const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); };
async function saveSub(sub) {
  const j = sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({ user_id: me.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth }, { onConflict: 'endpoint' });
  if (error) console.warn('abonnement', error.message);
}
async function refreshNotif() {
  if (!pushOK) notif = isIOS && !standalone ? 'ios' : 'unsupported';
  else if (Notification.permission === 'denied') notif = 'denied';
  else {
    const reg = await swReady, sub = reg && await reg.pushManager.getSubscription();
    notif = sub && Notification.permission === 'granted' ? 'on' : 'off';
    if (notif === 'on') saveSub(sub); // rattache l'appareil au compte connecté
  }
  if (me) render(); // le bouton et la carte d'installation dépendent de l'état
}
const inAppBrowser = isIOS && (/GSA|FBAN|FBAV|Instagram|Line|Snapchat|LinkedIn|Messenger/.test(navigator.userAgent) || !/Safari/.test(navigator.userAgent));
const SHARE = '<span class="ico"><svg width="14" height="16" viewBox="0 0 14 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11V1M3.5 4.5 7 1l3.5 3.5M4 7H2v10h10V7h-2"/></svg></span>';
function setupCard() {
  let later = 0; try { later = Number(localStorage.getItem('habitudes:notif-plus-tard')) || 0; } catch {}
  if (Date.now() < later) return '';
  const guide = `<a class="link" href="guide.html${notif === 'denied' ? '#bloquees' : ''}">Guide complet</a>`;
  const skip = '<button class="link" id="setup-later">Plus tard</button>';
  if (notif === 'ios' && inAppBrowser) return `<section class="card setup"><h3>📲 Ouvre ce lien dans Safari</h3>
    <p>Tu es dans le navigateur d'une autre appli (Gmail, Instagram…). Sur iPhone, les notifications marchent seulement depuis Safari.</p>
    <ol><li><span>Touche <b>•••</b> ou ${SHARE} dans cette fenêtre</span></li><li><span>Choisis <b>« Ouvrir dans Safari »</b></span></li><li><span>Suis les étapes qui vont apparaître là</span></li></ol>
    <div class="row">${guide}${skip}</div></section>`;
  if (notif === 'ios') return `<section class="card setup"><h3>📲 Reçois les rappels sur ton iPhone</h3>
    <p>Sur iPhone, il faut d'abord installer l'appli sur ton écran d'accueil. Ça prend 20 secondes.</p>
    <ol><li><span>Touche ${SHARE} <b>Partager</b>, en bas de Safari</span></li><li><span>Défile et choisis <b>« Sur l'écran d'accueil »</b>, puis <b>Ajouter</b></span></li><li><span>Ferme Safari et ouvre <b>Habitudes</b> depuis ton écran d'accueil</span></li><li><span>Là, touche <b>Activer</b> puis <b>Autoriser</b></span></li></ol>
    <div class="row">${guide}${skip}</div></section>`;
  if (notif === 'off') return `<section class="card setup"><h3>🔔 Dernière étape: active les notifications</h3>
    <p>Rappel à 21 h s'il te reste des habitudes, et une alerte quand quelqu'un finit sa journée. Ton appareil va demander la permission: touche <b>Autoriser</b>.</p>
    <div class="row"><button class="btn go" id="setup-go">Activer les notifications</button>${guide}${skip}</div></section>`;
  if (notif === 'denied') return `<section class="card setup"><h3>🔕 Les notifications sont bloquées</h3>
    <p>Tu as refusé la permission. Pour la redonner, le guide explique où la trouver selon ton appareil.</p>
    <div class="row">${guide}${skip}</div></section>`;
  return '';
}

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2700); }
async function onNotifClick() {
  if (notif === 'ios') { location.href = 'guide.html'; return; }
  if (notif === 'denied') { location.href = 'guide.html#bloquees'; return; }
  if (notif === 'on') {
    const { data, error } = await sb.functions.invoke('push', { body: { action: 'test' } });
    return toast(error ? 'Oups, l’essai n’est pas parti' : data?.sent ? 'Notification d’essai envoyée 🔔' : 'Aucun appareil trouvé');
  }
  if (await Notification.requestPermission() !== 'granted') return refreshNotif();
  try {
    const reg = await swReady || await navigator.serviceWorker.ready;
    const { data, error } = await sb.functions.invoke('push', { body: { action: 'key' } });
    if (error || !data?.publicKey) throw error || new Error('clé manquante');
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(data.publicKey) });
    await saveSub(sub);
    await sb.functions.invoke('push', { body: { action: 'test' } });
    toast('Notifications activées 🔔');
  } catch (e) { alert('Impossible d’activer les notifications: ' + (e?.message || e)); }
  refreshNotif();
}

// ---------- The Frog et modification des habitudes ----------
const frogFor = (uid, day = ymd(new Date())) => data.frogs.find(f => f.user_id === uid && f.day === day);
function frogCard(p, mine, habits) {
  if (!data.frogReady) return mine ? `<section class="frog"><h3>🐸 The Frog</h3><p>Le suivi The Frog est temporairement indisponible.</p><button class="link" data-retry-frog>Réessayer</button></section>` : '';
  const f = frogFor(p.id), stats = data.frogStats.find(x => x.user_id === p.id);
  const activeHabit = f && habits.find(h => h.id === f.habit_id);
  const name = f && (activeHabit?.name || f.habit_name);
  const eaten = Boolean(f?.eaten_at);
  const total = Number(stats?.eaten_total || 0), recent = Number(stats?.eaten_30 || 0);
  return `<section class="frog ${eaten ? 'eaten' : ''}" aria-label="The Frog de ${esc(p.name)}">
    <div class="frog-top"><h3>🐸 The Frog</h3><span class="frog-status">${eaten ? '✓ Eaten !' : 'Le défi du jour'}</span></div>
    ${f ? `<p class="frog-name">${esc(name)}</p><p>${eaten ? 'Grenouille mangée. Bien joué !' : activeHabit ? 'Commence par le plus difficile. Une coche, une victoire.' : 'Cette habitude a été retirée. Choisis un autre défi.'}</p>` : `<p>${mine ? 'Choisis ton habitude la plus difficile pour aujourd’hui.' : 'Pas encore de Frog choisi aujourd’hui.'}</p>`}
    ${mine ? !habits.length ? '<p>Ajoute une habitude pour choisir ton Frog.</p>' : eaten ? '<p>Défi du jour accompli. Nouveau choix demain.</p>' : `<div class="frog-top">${activeHabit ? `<button class="btn" data-h="${f.habit_id}" data-d="${f.day}">🐸 Eat the Frog</button>` : ''}<button class="${activeHabit ? 'link' : 'btn'}" data-choose-frog>${activeHabit ? 'Changer mon Frog' : 'Choisir mon Frog du jour'}</button></div>` : ''}
    <div class="frog-score"><b class="num">${total}</b> Frog${total > 1 ? 's' : ''} eaten · ${recent} sur les 30 derniers jours<br><small>1 maximum par jour · depuis l’activation du suivi</small></div>
  </section>`;
}
function openEditor(kind, habitId) {
  const dialog = document.getElementById('edit-dialog');
  if (dialog.open) return;
  const habits = data.habits.filter(h => h.user_id === me.id && !h.archived_at);
  const habit = habits.find(h => h.id === habitId);
  if (kind === 'rename' && !habit) return;
  const frog = frogFor(me.id), day = ymd(new Date());
  const rename = kind === 'rename';
  dialog.innerHTML = `<form id="editor-form">
    <h2 id="editor-title">${rename ? 'Renommer l’habitude' : '🐸 Choisis ton Frog'}</h2>
    <p>${rename ? 'Tes coches, tes séries et ton historique restent intacts.' : 'Quel défi as-tu le plus envie de remettre à plus tard ? Choisis une seule habitude pour aujourd’hui.'}</p>
    <label for="editor-value">${rename ? 'Nom de l’habitude' : 'Mon habitude la plus difficile'}</label>
    ${rename ? `<input id="editor-value" name="habitName" required maxlength="120" autocomplete="off" value="${esc(habit.name)}">` : `<select id="editor-value" required><option value="">Sélectionne une habitude…</option>${habits.map(h => `<option value="${h.id}" ${frog?.habit_id === h.id ? 'selected' : ''}>${esc(h.name)}</option>`).join('')}</select>`}
    ${rename ? '' : '<p>Sa coche du jour compte automatiquement comme « eaten ». Une habitude déjà cochée compte aussi. Décocher corrige le score.</p>'}
    <div id="editor-error" class="editor-error" role="alert"></div>
    <div class="editor-actions"><button type="button" class="btn cancel" id="editor-cancel">Annuler</button><button class="btn" type="submit">${rename ? 'Enregistrer' : 'C’est mon Frog'}</button></div>
  </form>`;
  let busy = false;
  dialog.oncancel = e => { if (busy) e.preventDefault(); };
  document.getElementById('editor-cancel').onclick = () => dialog.close();
  document.getElementById('editor-form').onsubmit = async e => {
    e.preventDefault();
    if (busy) return;
    const input = document.getElementById('editor-value'), value = input.value.trim();
    const errorEl = document.getElementById('editor-error');
    if (!value) { errorEl.textContent = 'Choisis un nom ou une habitude.'; input.focus(); return; }
    if (!rename && day !== ymd(new Date())) { errorEl.textContent = 'Une nouvelle journée a commencé. Ferme cette fenêtre et choisis ton Frog du jour.'; return; }
    busy = true; errorEl.textContent = '';
    dialog.querySelectorAll('button,input,select').forEach(el => el.disabled = true);
    try {
      await saveChange(async () => {
        const result = rename
          ? await sb.from('habits').update({ name: value }).eq('id', habit.id).eq('user_id', me.id).select('id,name').single()
          : await sb.rpc('choose_frog', { p_habit_id: value, p_day: day, p_timezone: Intl.DateTimeFormat().resolvedOptions().timeZone });
        if (result.error) throw result.error;
      });
      dialog.close();
      toast(rename ? 'Habitude renommée' : '🐸 Ton Frog du jour est choisi !');
    } catch (error) { errorEl.textContent = error.message || 'Enregistrement impossible. Réessaie.'; }
    finally { busy = false; dialog.querySelectorAll('button,input,select').forEach(el => el.disabled = false); }
  };
  dialog.showModal();
  const input = document.getElementById('editor-value'); input.focus();
  if (rename) input.select();
}

// ---------- Rendu ----------
function render() {
  const M = model();
  const ps = people();
  const personal = preferredView === 'personal';
  const visiblePeople = personal ? ps.filter(p => p.id === me.id) : ps;
  const todayKey = ymd(new Date());
  renderedDay = todayKey;

  // Groupe
  let gd = 0, gt = 0; for (const p of ps) { const s = M.day(p.id, todayKey); gd += s.done; gt += s.total; }
  const board = ps.map(p => ({ p, r: M.rateRange(p.id, 0, 7) })).filter(o => o.r !== null).sort((a, b) => b.r - a.r);
  const medals = ['🥇', '🥈', '🥉'];
  const top = `
    <div class="top">
      <div><div class="date">${new Date().toLocaleDateString('fr-CA', { weekday:'long', day:'numeric', month:'long' })}</div><h1>Habitudes</h1><div class="tag">On se tient accountable.</div></div>
      <div class="meta">${notifButton()}<span class="live ${live?'ok':''}">en direct</span><button class="link" id="out">Déconnexion</button></div>
    </div>`;
  const navigation = `<nav class="view-nav" aria-label="Affichage des habitudes">
    <button data-view="personal" aria-pressed="${personal}">Mon espace</button>
    <button data-view="group" aria-pressed="${!personal}">Le groupe</button>
  </nav>`;
  const mineToday = M.day(me.id, todayKey);
  const myName = ps.find(p => p.id === me.id)?.name || 'toi';
  const personalIntro = `<section class="card personal-intro" style="--pc:${colorOf(me.id)}">
    ${ring(mineToday.done, mineToday.total, 76, 8)}
    <div><h2>Ton espace, ${esc(myName)}</h2><p>${mineToday.total ? `${mineToday.done} sur ${mineToday.total} habitudes cochées aujourd’hui.` : 'Commence par ajouter une habitude qui compte pour toi.'}</p><p style="font-size:12px;margin-top:6px">Tes habitudes restent visibles par le groupe.</p></div>
  </section>`;
  const groupSummary = `<section class="card group">
      <div class="big">${ring(gd, gt, 76, 8)}<div><div class="k">Le groupe aujourd'hui</div><div class="v num">${gt ? Math.round(gd / gt * 100) : 0}<small> %</small></div><div class="tag" style="font-size:13px">${gd} coché${gd > 1 ? 's' : ''} sur ${gt}</div></div></div>
      <div class="pod">${board.slice(0, 3).map((o, i) => `<div class="p" style="--pc:${colorOf(o.p.id)}" data-tip="${esc(o.p.name)} · ${pct(o.r)} sur 7 jours"><span class="av s">${initial(o.p.name)}</span><b>${medals[i]} ${esc(o.p.name)}</b><span class="num">${pct(o.r)}</span></div>`).join('')}</div>
    </section>`;

  // Une carte par personne
  const days = lastDays(7);
  const cards = visiblePeople.map(p => {
    const mine = p.id === me.id, pc = colorOf(p.id);
    const habits = M.habitsOf(p.id);
    const t = M.day(p.id, todayKey);
    const streaks = habits.map(h => ({ h, s: M.streak(h), b: M.best(h) }));
    const cur = [...streaks].sort((a, b) => b.s - a.s)[0];
    const rec = [...streaks].sort((a, b) => b.b - a.b)[0];
    const r30 = M.rateRange(p.id, 0, 30), rPrev = M.rateRange(p.id, 30, 60);
    const diff = r30 !== null && rPrev !== null ? Math.round((r30 - rPrev) * 100) : null;
    const perf30 = lastDays(30).filter(d => M.perfect(p.id, ymd(d))).length;
    const ps_ = M.perfectStreak(p.id);
    const wd = M.weekday(p.id); const known = [1,2,3,4,5,6,0].filter(i => wd[i] !== null && wd[i] > 0);
    const bestD = known.length ? known.reduce((a, b) => wd[b] > wd[a] ? b : a) : null;
    const sub = !habits.length ? 'Pas encore d’habitude' :
      t.total && t.done === t.total ? 'Journée parfaite ✨' :
      ps_ >= 2 ? `${ps_} journées parfaites de suite 🔥` :
      bestD !== null ? `Meilleur jour: ${JOURS_LONG[bestD]}` : `${habits.length} habitude${habits.length > 1 ? 's' : ''}`;

    const head = `<div class="hrow head"><span></span>${days.map(d => `<span class="${ymd(d)===todayKey?'today':''}">${JOURS[d.getDay()]}<br>${d.getDate()}</span>`).join('')}</div>`;
    const rows = streaks.map(({ h, s }) => `
      <div class="hrow">
        <div class="hname"><span class="n" data-tip="${esc(h.name)} · record ${M.best(h)} · ${M.rateRange(p.id, 0, 30, h) === null ? '—' : pct(M.rateRange(p.id, 0, 30, h))} sur 30 j">${esc(h.name)}</span>${s ? `<span class="chip ${s >= 7 ? 'hot' : ''}">🔥 ${s}</span>` : ''}${frogFor(p.id)?.habit_id === h.id ? '<span class="chip" title="The Frog du jour">🐸</span>' : ''}${mine ? `<button class="habit-action" data-rename="${h.id}" aria-label="Renommer ${esc(h.name)}" title="Renommer">✎</button><button class="del" data-del="${h.id}" aria-label="Retirer ${esc(h.name)}" title="Retirer">✕</button>` : ''}</div>
        ${days.map(d => { const k = ymd(d), on = M.set.has(h.id + k);
          const open = mine && k === todayKey; // le passé est figé (règle aussi appliquée par la base)
          return `<button class="box ${on?'on':''} ${k===todayKey?'today':''} ${mine && k < todayKey ? 'locked' : ''}" ${open?`data-h="${h.id}" data-d="${k}"`:'disabled'} aria-label="${esc(h.name)} ${k}" ${open ? '' : `data-tip="${esc(h.name)} · ${JOURS[d.getDay()]} ${d.getDate()} · ${on ? 'fait' : 'pas fait'}${mine && k < todayKey ? ' · 🔒 journée terminée' : ''}"`}>${CHECK}</button>`; }).join('')}
      </div>`).join('');

    // Calendrier: 20 semaines, colonnes = semaines qui commencent le dimanche
    const weeks = 30, end = new Date(), start = addDays(end, -(weeks - 1) * 7 - end.getDay());
    let cells = '', months = '';
    for (let w = 0; w < weeks; w++) {
      const first = [0,1,2,3,4,5,6].map(i => addDays(start, w * 7 + i)).find(x => x.getDate() === 1);
      months += `<span>${first && w < weeks - 1 ? MOIS[first.getMonth()] : ''}</span>`;
      for (let i = 0; i < 7; i++) {
        const dd = addDays(start, w * 7 + i), k = ymd(dd);
        if (k > todayKey) { cells += '<i class="fut"></i>'; continue; }
        const s = M.day(p.id, k), r = s.total ? s.done / s.total : 0;
        const lvl = !s.done ? 0 : r >= 1 ? 4 : r >= .66 ? 3 : r >= .33 ? 2 : 1;
        cells += `<i class="l${lvl}${k===todayKey?' t':''}" data-tip="${JOURS[dd.getDay()]} ${dd.getDate()} ${MOIS[dd.getMonth()]} · ${s.total ? `${s.done}/${s.total}` : 'rien à cocher'}"></i>`;
      }
    }
    const bs = badgesFor(p.id, M);

    return `
      <section class="card person ${mine?'me':''}" style="--pc:${pc}">
        <div class="ph">
          <span class="av">${initial(p.name)}</span>
          <div class="who"><h2>${esc(p.name)}${mine ? '<small>toi</small>' : ''}</h2><div class="sub">${sub}</div></div>
          ${ring(t.done, t.total)}
        </div>
        ${frogCard(p, mine, habits)}
        <div class="kpis">
          <div class="kpi" data-tip="${cur && cur.s ? esc(cur.h.name) : 'Coche une journée pour partir une série'}"><div class="k">Série</div><div class="v num">${cur ? cur.s : 0}<small> j</small></div><div class="t">${cur && cur.s ? esc(cur.h.name) : '—'}</div></div>
          <div class="kpi" data-tip="${rec && rec.b ? `Plus longue série: ${esc(rec.h.name)}` : 'Aucune série encore'}"><div class="k">Record</div><div class="v num">${rec ? rec.b : 0}<small> j</small></div><div class="t">${rec && rec.b ? esc(rec.h.name) : '—'}</div></div>
          <div class="kpi" data-tip="Part des habitudes cochées sur 30 jours"><div class="k">Réussite 30 j</div><div class="v num">${r30 === null ? '—' : Math.round(r30 * 100)}<small>${r30 === null ? '' : ' %'}</small></div><div class="t ${diff > 0 ? 'up' : diff < 0 ? 'down' : ''}">${diff === null ? 'nouveau' : diff > 0 ? `▲ ${diff} pts` : diff < 0 ? `▼ ${-diff} pts` : 'stable'}</div></div>
          <div class="kpi" data-tip="Journées où tout a été coché, sur 30 jours"><div class="k">Parfaites</div><div class="v num">${perf30}</div><div class="t">sur 30 j</div></div>
        </div>
        <div class="sect"><span>Cette semaine</span><span>${habits.length} habitude${habits.length > 1 ? 's' : ''}</span></div>
        <div class="habits">${habits.length ? head + rows : '<div class="empty">Aucune habitude encore.</div>'}
          ${mine ? `<div class="add"><input id="new" type="text" placeholder="Nouvelle habitude (ex.: 10 min de lecture)"><button class="btn" id="add">Ajouter</button></div>` : ''}
        </div>
        <div class="sect"><span>30 dernières semaines</span></div>
        <div class="heat-wrap"><div class="heat-months">${months}</div><div class="heat">${cells}</div></div>
        <div class="heat-foot"><span>${data.checks.filter(c => c.user_id === p.id).length} cochés au total</span><span class="legend">moins <i style="background:var(--cell)"></i><i style="background:color-mix(in srgb, var(--pc) 30%, var(--cell))"></i><i style="background:color-mix(in srgb, var(--pc) 55%, var(--cell))"></i><i style="background:color-mix(in srgb, var(--pc) 78%, var(--cell))"></i><i style="background:var(--pc)"></i> tout</span></div>
        <div class="sect"><span>Badges</span><span>${bs.filter(b => b.ok).length}/${bs.length}</span></div>
        <div class="badges">${bs.map(b => `<span class="bdg ${b.ok?'':'off'}" data-tip="${b.t} · ${b.d}${b.ok ? ' ✓' : ''}">${b.e}</span>`).join('')}</div>
      </section>`;
  }).join('');

  // Classement 7 jours
  const lb = `
    <section class="card">
      <h3>Classement <small>7 derniers jours</small></h3>
      ${board.length ? `<div class="lb">${board.map((o, i) => `<div class="r" style="--pc:${colorOf(o.p.id)}" data-tip="${esc(o.p.name)} · ${pct(o.r)} des habitudes cochées · ${M.perfectStreak(o.p.id)} journée(s) parfaite(s) de suite">${i < 3 ? `<span class="medal">${medals[i]}</span>` : `<span class="rank">${i + 1}</span>`}<span class="av s">${initial(o.p.name)}</span><span class="nm">${esc(o.p.name)}</span><span class="track"><i style="width:${o.r * 100}%"></i></span><span class="pct num">${pct(o.r)}</span></div>`).join('')}</div>` : '<div class="empty">Personne n’a encore d’habitude.</div>'}
    </section>`;

  // Jour de la semaine, tout le monde côte à côte
  const withHabits = visiblePeople.filter(p => M.habitsOf(p.id).length);
  const wds = withHabits.map(p => ({ p, w: M.weekday(p.id) }));
  const order = [1,2,3,4,5,6,0];
  let groupBest = null;
  { let bestV = -1; for (const i of order) { const v = wds.map(x => x.w[i]).filter(x => x !== null); if (v.length) { const avg = v.reduce((a, b) => a + b, 0) / v.length; if (avg > bestV && avg > 0) { bestV = avg; groupBest = i; } } } }
  const dow = `
    <section class="card">
      <h3>Par jour de la semaine <small>12 semaines</small></h3>
      ${wds.length ? `<div class="dow">${order.map(i => `<div class="c"><div class="bars">${wds.map(x => `<i style="--pc:${colorOf(x.p.id)};height:${(x.w[i] || 0) * 100}%" data-tip="${esc(x.p.name)} · ${JOURS_LONG[i]} · ${x.w[i] === null ? 'pas de données' : pct(x.w[i])}"></i>`).join('')}</div><span class="lab">${JOURS[i]}</span></div>`).join('')}</div>
      <div class="keys">${wds.map(x => `<span style="--pc:${colorOf(x.p.id)}">${esc(x.p.name)}</span>`).join('')}</div>
      <div class="insight">${groupBest !== null ? `${personal ? 'Ton meilleur jour est le' : 'Le groupe est le plus solide le'} <b>${JOURS_LONG[groupBest]}</b>.` : 'Pas encore assez de données.'}</div>` : '<div class="empty">Pas encore de données.</div>'}
    </section>`;

  // Fil d'activité
  const names = new Map(data.profiles.map(x => [x.id, x.name]));
  const hname = new Map(data.habits.map(h => [h.id, h.name]));
  const recent = data.checks.filter(c => c.created_at && (!personal || c.user_id === me.id)).sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 12);
  const feed = `
    <section class="card">
      <h3>${personal ? 'Mon activité' : 'Activité'} <small>en direct</small></h3>
      ${recent.length ? `<ul class="feed">${recent.map(c => { const late = c.day !== ymd(new Date(c.created_at)); const dd = new Date(c.day + 'T12:00');
        return `<li style="--pc:${colorOf(c.user_id)}"><span class="av s">${initial(names.get(c.user_id))}</span><span class="txt"><b>${esc(names.get(c.user_id) || '?')}</b> a coché <b>${esc(hname.get(c.habit_id) || '?')}</b>${late ? ` <span class="late">pour ${JOURS[dd.getDay()]} ${dd.getDate()}</span>` : ''}</span><span class="when">${ago(c.created_at)}</span></li>`; }).join('')}</ul>` : '<div class="empty">Rien encore. Le premier qui coche!</div>'}
    </section>`;

  // Conserver le focus et le texte du champ « nouvelle habitude » à travers les re-rendus
  const inp = document.getElementById('new'), keep = inp ? { v: inp.value, f: document.activeElement === inp } : null;
  app.innerHTML = top + setupCard() + deadlineBanner(mineToday.done, mineToday.total) + navigation + (personal
    ? `<div class="personal-layout">${personalIntro}<div class="people personal">${cards}</div><div style="margin-bottom:18px">${dow}</div>${feed}</div>`
    : groupSummary + `<div class="people">${cards}</div><div class="duo">${lb}${dow}</div>` + feed);
  if (keep) { const n = document.getElementById('new'); if (n) { n.value = keep.v; if (keep.f) n.focus(); } }
  app.querySelectorAll('.heat-wrap').forEach(hw => hw.scrollLeft = hw.scrollWidth);
  bind();
}

function celebrate() {
  const colors = ['--c0','--c1','--c2','--c3','--c4','--c5'].map(v => getComputedStyle(document.documentElement).getPropertyValue(v).trim());
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.setProperty('--dx', (Math.random() * 200 - 100) + 'px'); c.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    c.style.animationDuration = (1.4 + Math.random() * 1.2) + 's'; c.style.animationDelay = Math.random() * .3 + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 3000);
  }
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = 'Journée parfaite ✨'; document.body.appendChild(t); setTimeout(() => t.remove(), 2700);
}

function bind() {
  app.querySelectorAll('[data-rename]').forEach(b => b.onclick = () => openEditor('rename', b.dataset.rename));
  app.querySelectorAll('[data-choose-frog]').forEach(b => b.onclick = () => openEditor('frog'));
  app.querySelectorAll('[data-retry-frog]').forEach(b => b.onclick = () => load());
  app.querySelectorAll('[data-view]').forEach(button => button.onclick = () => setView(button.dataset.view));
  document.getElementById('notif')?.addEventListener('click', onNotifClick);
  document.getElementById('setup-go')?.addEventListener('click', onNotifClick);
  document.getElementById('setup-later')?.addEventListener('click', () => { try { localStorage.setItem('habitudes:notif-plus-tard', Date.now() + 3 * 864e5); } catch {} render(); });
  document.getElementById('out').onclick = () => sb.auth.signOut();
  const add = async () => {
    const input = document.getElementById('new'); const name = input.value.trim();
    if (!name) return;
    input.value = '';
    const { error } = await sb.from('habits').insert({ name });
    if (error) alert(error.message); else reload(0);
  };
  const addBtn = document.getElementById('add');
  if (addBtn) { addBtn.onclick = add; document.getElementById('new').addEventListener('keydown', e => { if (e.key === 'Enter') add(); }); }
  app.querySelectorAll('[data-h]').forEach(b => b.onclick = async () => {
    if (saving) return;
    const habit_id = b.dataset.h, day = b.dataset.d;
    if (!data.habits.some(h => h.id === habit_id && h.user_id === me.id)) return;
    if (day !== ymd(new Date())) { toast('🔒 Cette journée est terminée'); reload(0); return; }
    const on = !model().set.has(habit_id + day);
    const before = model().day(me.id, ymd(new Date()));
    const isFrog = on && frogFor(me.id, day)?.habit_id === habit_id;
    b.disabled = true;
    try {
      await saveChange(async () => {
        const result = on
          ? await sb.from('checks').insert({ habit_id, day })
          : await sb.from('checks').delete().match({ habit_id, day, user_id: me.id }).select();
        if (result.error) throw result.error;
        if (!on && !result.data?.length) throw new Error('🔒 Cette journée est terminée');
        if (on) data.checks.push({ habit_id, day, user_id: me.id, created_at: new Date().toISOString() });
        else data.checks = data.checks.filter(c => !(c.habit_id === habit_id && c.day === day));
        const after = model().day(me.id, ymd(new Date()));
        if (on && day === ymd(new Date()) && after.total && after.done === after.total && before.done < before.total) celebrate();
        if (isFrog) toast('🐸 Frog eaten ! Un défi difficile de moins.');
      });
    } catch (error) { alert(error.message || 'Impossible de sauvegarder cette coche.'); }
    finally { b.disabled = false; }
  });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Retirer cette habitude? Elle disparaît de ta semaine, mais son historique reste dans tes stats.')) return;
    const { error } = await sb.from('habits').update({ archived_at: new Date().toISOString() }).eq('id', b.dataset.del);
    if (error) alert(error.message); else reload(0);
  });
}

// Infobulle partagée (souris et toucher)
const tipEl = document.getElementById('tip');
function showTip(el) {
  const r = el.getBoundingClientRect();
  tipEl.textContent = el.dataset.tip; tipEl.style.display = 'block';
  const w = tipEl.offsetWidth;
  tipEl.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + 'px';
  tipEl.style.top = Math.max(8, r.top - 36) + 'px';
}
document.addEventListener('mouseover', e => { const t = e.target.closest('[data-tip]'); if (t) showTip(t); else tipEl.style.display = 'none'; });
document.addEventListener('click', e => { const t = e.target.closest('[data-tip]'); if (t) showTip(t); });
document.addEventListener('scroll', () => tipEl.style.display = 'none', true);

async function enter(session) {
  me = session.user;
  preferredView = readView(me.id);
  const name = me.user_metadata?.name || me.email.split('@')[0];
  await sb.from('profiles').upsert({ id: me.id, name }, { onConflict: 'id', ignoreDuplicates: true });
  await load();
  subscribe();
  refreshNotif();
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session && (!me || me.id !== session.user.id)) enter(session);
  if (event === 'SIGNED_OUT') { document.getElementById('edit-dialog').close(); me = null; if (channel) sb.removeChannel(channel); renderAuth(); }
});
const { data: { session } } = await sb.auth.getSession();
if (session) enter(session); else renderAuth();
